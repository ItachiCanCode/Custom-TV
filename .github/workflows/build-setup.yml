name: Build Setup Apps
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - run: gradle assembleDebug --no-daemon
        working-directory: setup-android
      - uses: actions/upload-artifact@v4
        with:
          name: VoidLauncherSetup-android-apk
          path: setup-android/app/build/outputs/apk/debug/VoidLauncherSetup-debug.apk
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet publish setup-windows/VoidLauncherSetup.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o out
      - uses: actions/upload-artifact@v4
        with:
          name: VoidLauncherSetup-windows-exe
          path: out/VoidLauncherSetup.exe
