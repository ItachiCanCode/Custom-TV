name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read

jobs:
  launcher:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - run: gradle assembleDebug --no-daemon
      # The asset name must stay VoidLauncher.apk: the setup apps download releases/latest/download/VoidLauncher.apk
      - run: cp app/build/outputs/apk/debug/VoidLauncher-debug.apk VoidLauncher.apk
      - uses: actions/upload-artifact@v4
        with:
          name: rel-launcher
          path: VoidLauncher.apk

  setup-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - run: gradle assembleDebug --no-daemon
        working-directory: setup-android
      - run: cp setup-android/app/build/outputs/apk/debug/VoidLauncherSetup-debug.apk VoidLauncherSetup-Android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: rel-setup-android
          path: VoidLauncherSetup-Android.apk

  setup-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
      - run: dotnet publish setup-windows/VoidLauncherSetup.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o out
      - uses: actions/upload-artifact@v4
        with:
          name: rel-setup-windows
          path: out/VoidLauncherSetup.exe

  publish:
    needs: [launcher, setup-android, setup-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: rel-*
          merge-multiple: true
          path: dist
      - run: ls -l dist
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/VoidLauncher.apk
            dist/VoidLauncherSetup-Android.apk
            dist/VoidLauncherSetup.exe
          generate_release_notes: true
          body: |
            ## Downloads
            - **VoidLauncher.apk**: Void Launcher itself (install on your Android TV)
            - **VoidLauncherSetup-Android.apk**: phone app that installs Void Launcher on your TV over Wi-Fi
            - **VoidLauncherSetup.exe**: Windows app that installs Void Launcher on your TV over the network

            See the README for setup steps (enable Network/USB debugging on the TV first).
