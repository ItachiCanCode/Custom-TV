name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read

jobs:
  launcher:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - run: gradle assembleDebug --no-daemon
      # Name must stay app-debug.apk: the setup apps download releases/latest/download/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: rel-launcher
          path: app/build/outputs/apk/debug/app-debug.apk

  setup-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - run: gradle assembleDebug --no-daemon
        working-directory: setup-android
      - run: cp setup-android/app/build/outputs/apk/debug/app-debug.apk TvSetup-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: rel-setup-android
          path: TvSetup-android.apk

  setup-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet publish setup-windows/TvLauncherSetup.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o out
      - uses: actions/upload-artifact@v4
        with:
          name: rel-setup-windows
          path: out/TvLauncherSetup.exe

  publish:
    needs: [launcher, setup-android, setup-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: rel-*
          merge-multiple: true
          path: dist
      - run: ls -l dist
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/app-debug.apk
            dist/TvSetup-android.apk
            dist/TvLauncherSetup.exe
          generate_release_notes: true
          body: |
            ## Downloads
            - **app-debug.apk**: the TV launcher itself (install on your Android TV)
            - **TvSetup-android.apk**: phone app that installs the launcher on your TV over Wi-Fi
            - **TvLauncherSetup.exe**: Windows app that installs the launcher on your TV over the network

            See the README for setup steps (enable Network/USB debugging on the TV first).
