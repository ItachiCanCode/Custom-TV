name: Generate Gradle wrapper
# One-off helper: generates the Gradle wrapper for both projects and commits it to this branch.
on:
  push:
    branches: [wrapper-gen]
permissions:
  contents: write
jobs:
  wrapper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - run: gradle wrapper --gradle-version 8.7 --no-daemon
      - run: gradle wrapper --gradle-version 8.7 --no-daemon
        working-directory: setup-android
      - name: Commit wrapper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gradlew gradlew.bat gradle setup-android/gradlew setup-android/gradlew.bat setup-android/gradle
          git commit -m "Add Gradle wrapper (8.7) for both projects"
          git push
